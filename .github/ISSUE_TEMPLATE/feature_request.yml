name: Feature request
description: An idea for a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What are you trying to do? An example diagram helps.
  - type: markdown
    attributes:
      value: The plugin makes no network requests, so features that need a server or the internet are out of scope.
