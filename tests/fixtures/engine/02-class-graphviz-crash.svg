ebAssembly module violates the following Content Security policy directive because 'unsafe-eval' is not an allowed source of script in the following Content Security Policy directive: "script-src 'self'".). Build with -sASSERTIONS for more info.</text><text x="5" y="174" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">  </text><text x="5" y="188" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Caused by java.lang.RuntimeException: RuntimeError: Aborted(CompileError: WebAssembly.instantiate(): Compiling or instantiating WebAssembly module violates the following Content Security policy directive because 'unsafe-eval' is not an allowed source of script in the following Content Security Policy directive: "script-src 'self'".). Build with -sASSERTIONS for more info.</text><text x="5" y="206" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="224" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="242" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="256" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Please go to https://plantuml.com/graphviz-dot to check your GraphViz version.</text><text x="5" y="274" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="288" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">You should send this diagram and this image to </text><text x="287.88" y="288" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">plantuml@gmail.com</text><text x="422.56" y="288" font-size="12" fill="#00